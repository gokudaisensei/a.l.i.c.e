# Minimal HA config for tests: no cloud/discovery, with the demo integration for fake devices.
homeassistant:
  name: Alice Test Home
  unit_system: metric
  time_zone: UTC

http:
api:
websocket_api:
auth:
onboarding:
config:
person:
history:
logbook:
sun:
conversation:
input_select:
recorder:
  commit_interval: 1

# Fake devices: lights, switches, climate, covers, sensors, etc.
demo:

# Controllable helpers whose state changes are easy to assert on.
input_boolean:
  test_switch:
    name: Test Switch
  test_switch_2:
    name: Test Switch 2
input_number:
  test_level:
    name: Test Level
    min: 0
    max: 100
    step: 1
scene:
  - name: Test Scene
    entities:
      input_boolean.test_switch: "on"
# Scripts and automations are edited through Home Assistant's config API (as the UI does), so they live in files it can write.
script: !include scripts.yaml
automation: !include automations.yaml

# A door sensor driven by a helper, so a test can open and close a "door" without hardware.
template:
  - binary_sensor:
      - name: Test door
        unique_id: alice_test_door
        device_class: door
        state: "{{ is_state('input_boolean.test_switch', 'on') }}"
