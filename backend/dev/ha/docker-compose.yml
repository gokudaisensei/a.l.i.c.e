# Disposable Home Assistant for integration tests, served on 8123.
# Reset to a clean instance: docker compose down -v
name: alice-ha-mock
services:
  # Creates the files Home Assistant's config API writes into (scripts.yaml, automations.yaml) if they are missing.
  init:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    entrypoint: ["sh", "-c", "touch /config/scripts.yaml /config/automations.yaml"]
    volumes:
      - ha-data:/config
  homeassistant:
    depends_on:
      init:
        condition: service_completed_successfully
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    container_name: alice-ha-mock
    ports:
      - "127.0.0.1:${HA_PORT:-8123}:8123"
    volumes:
      - ha-data:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
    environment:
      TZ: UTC
    restart: "no"
volumes:
  ha-data:
