# Disposable Home Assistant for integration tests, served on 8123.
# Reset to a clean instance: docker compose down -v
name: alice-ha-mock
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    container_name: alice-ha-mock
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ha-data:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
    environment:
      TZ: UTC
    restart: "no"
volumes:
  ha-data:
