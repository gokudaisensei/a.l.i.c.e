name: backend-kt

on:
  workflow_dispatch:
  push:
    paths:
      - "backend-kt/**"
      - "frontend/**"
      - ".github/workflows/backend-kt.yml"
  pull_request:
    paths:
      - "backend-kt/**"
      - "frontend/**"
      - ".github/workflows/backend-kt.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-kt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Install distribution
        run: ./gradlew :server:installDist --console=plain

  # Not required to pass: the native image is an experiment. A failure shows red here instead of being hidden.
  native-smoke:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-kt
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build install dist
        run: ./gradlew :server:installDist --console=plain
      - name: Native image smoke build
        run: |
          set -euo pipefail
          CP=$(find server/build/install/server/lib -name '*.jar' | tr '\n' ':')
          native-image -cp "$CP" alice.server.MainKt -o /tmp/alice-native-smoke \
            --initialize-at-build-time=kotlin.DeprecationLevel \
            --report-unsupported-elements-at-runtime \
            --enable-url-protocols=http,https \
            --no-fallback
          test -f /tmp/alice-native-smoke

  # Not required to pass until the frontend's own lint and build are clean; failures show red instead of being hidden.
  frontend-surface:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          bun run lint
          bun run build

  contract-e2e-reference:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract/e2e reference
        run: |
          echo "Contract fixtures and frontend e2e against Kotlin backend require a running stack (backend-kt + frontend + optional HA/mock)."
          echo "Use backend-kt server install dist or native binary with frontend e2e harness in a prepared environment."
